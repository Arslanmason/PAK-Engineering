<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g transform="translate(0, 10)">
    <!-- Triangle -->
    <polygon points="200,20 360,320 40,320" fill="white" stroke="#0B2A59" stroke-width="16" stroke-linejoin="miter"/>
    
    <!-- P A K -->
    <text x="200" y="115" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#D32027" text-anchor="middle">P</text>
    <text x="200" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#D32027" text-anchor="middle">A</text>
    <text x="200" y="235" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#D32027" text-anchor="middle">K</text>
    
    <!-- Ship -->
    <g fill="#0B2A59">
      <!-- Hull -->
      <path d="M 100,265 C 120,275 150,280 200,280 L 300,280 L 295,265 L 250,265 L 250,255 L 240,255 L 240,265 L 160,265 Z" />
      <!-- Waves -->
      <path d="M 110,280 Q 140,270 170,280 T 230,280 T 290,280 L 285,285 Q 230,275 170,285 T 115,285 Z" fill="white" />
      <!-- Mast -->
      <rect x="140" y="230" width="2" height="35" />
      <!-- Cabin -->
      <rect x="250" y="250" width="30" height="15" />
      <rect x="260" y="240" width="10" height="10" />
      <rect x="264" y="235" width="2" height="5" />
    </g>
    
    <!-- Horizontal Line -->
    <line x1="65" y1="288" x2="335" y2="288" stroke="#0B2A59" stroke-width="4" />
    
    <!-- ENGINEERING -->
    <text x="200" y="312" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#D32027" text-anchor="middle" letter-spacing="1">ENGINEERING</text>
  </g>
  
  <!-- RC No -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0B2A59" text-anchor="middle">RC No: 304310</text>
</svg>
